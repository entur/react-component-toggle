# All deps in this repo are pinned to exact versions (no ^ or ~) except for
# peerDependencies. Dependabot preserves the existing range style, so it
# keeps writing exact versions on bumps as long as package.json stays exact.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/react-component-toggle/"
      - "/packages/rollup-plugin/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"
